name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ clang cmake

      - name: Configure
        run: cmake --preset linux-gcc-debug

      - name: Build
        run: cmake --build --preset linux-gcc-debug

      - name: Test
        run: ctest --preset linux-gcc-debug
